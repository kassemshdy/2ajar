# Local development dependencies only (the apps run on the host for fast reloads).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ajar
      POSTGRES_PASSWORD: ajar
      POSTGRES_DB: ajar_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajar"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
