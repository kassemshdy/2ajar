[project]
name = "ajar-worker"
version = "0.1.0"
description = "Background jobs for 2ajar (freshness expiry; image processing later)"
requires-python = ">=3.12"
dependencies = ["ajar-api"]

[tool.uv.sources]
ajar-api = { path = "../api", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.isort]
known-first-party = ["app", "worker"]
